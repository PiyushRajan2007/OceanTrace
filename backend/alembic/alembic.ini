# Alembic Configuration

# Database URL (from environment or config)
sqlalchemy.url = 

[loggers]
keys = sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)d_%%(created)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the "create date" field.  Can be string or datetime.datetime object.
# If None, UTC is used
# timezone =

# max length of characters to apply to the
# "slug" field.
#truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# When set to "true", revision file headers will be
# written as as "#flake8: noqa" which is useful for users
# who want to commit their revision scripts to an SCM
# such as git and don't want flake8 to complain
# about "E501 line too long" in autogenerated comments
# sqlalchemy_module_prefix = 'sa.'

# The Mako templating has the ability to optionally define a
# .mako.looks_like_sourcefile function that is passed the filename of
# each potential file in the alembic/versions/ directory. This function
# can be used to filter out any non-migration files
# or to change the extension considered a source file
# such that the following files
# mymodule.lib.interpolate_module_sqlalchemy.py
# is detected as a source file as well as the standard
# alembic module files
# .looks_like_sourcefile_suffix = .my_migration_file

# By default, the environment will call to conn.close()
# after a migration script completes successfully.
# This causes the database connection to be truly closed, so
# further attempts to use the connection will fail. This behavior
# may be undesirable.
# Setting sqlalse_engine_dispose=false will prevent EXECuting engine.dispose()
# after migration scripts complete, and will leave the connection open
# so that further "in process" query use is possible as well
# leaving them open for potential trailing whitespace
#
# sqlalchemy_engine_dispose = false
